# The Python library (python/): the generated models against the
# specification's schemas, ruff, mypy --strict, the tests with coverage on
# Linux (3.11 to 3.14), Windows and macOS (the client against the malicious
# test server among them, and the vectors of draft 0.5), the core without
# any extra, the client against the specification's reference server (over
# TLS, with a token bound to its key; events, its peer, sync, encrypted
# saves and its static export), the malicious test server from its command
# line, the conformance suite against the demo servers (Flask and FastAPI,
# with the levels they reach, a peer of the toolkit among them) and against
# the static library the generator writes, and the sdist and wheel. Nothing
# is published here: release.yml builds, attests and publishes a release
# (RELEASING.md).
name: python

on:
  push:
    branches: [ main ]
    paths: [ "python/**", "spec", ".github/workflows/python.yml" ]
  pull_request:
    paths: [ "python/**", "spec", ".github/workflows/python.yml" ]

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: generated code, ruff, mypy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: The generated models are those of the pinned specification
        run: python tools/generate.py --check
      - name: ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: mypy --strict
        run: mypy

  test:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04 ]
        python: [ "3.11", "3.12", "3.13", "3.14" ]
        include:
          - os: windows-2025
            python: "3.13"
          - os: macos-15
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: pytest, with coverage
        run: python -m pytest -m "not integration and not conformance" --cov --cov-report=term --cov-report=xml

  core:
    name: the core, without any extra
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the package alone, and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip list
      - name: pytest (what needs an extra is skipped)
        run: python -m pytest -m "not conformance"

  integration:
    name: the client against the reference server
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: pytest -m integration (stdlib, httpx and async transports; TLS, pairing, bound tokens, DNS-SD; events, peers, sync, encrypted saves, static export)
        run: python -m pytest -m integration -v

  hostile:
    name: the malicious test server, from its command line
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[crypto]" pytest
      - name: Every scenario, listed
        run: python tools/hostile_server.py --list
      - name: The Python client against every scenario
        run: python -m pytest tests/test_hostile.py -v
      - name: One scenario served as another language's CI starts it
        run: |
          python tools/hostile_server.py bad-digest --port 8099 > "$RUNNER_TEMP/hostile.json" 2> "$RUNNER_TEMP/hostile.log" &
          pid=$!
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:8099/.well-known/lantern >/dev/null && break
            sleep 0.2
          done
          head -n 1 "$RUNNER_TEMP/hostile.json"
          curl -fsS -D - -o /dev/null http://127.0.0.1:8099/api/lantern/v1/files/f_frost | grep -i '^repr-digest'
          grep -q '"path": "/.well-known/lantern"' "$RUNNER_TEMP/hostile.log"
          kill "$pid"
      - name: A scenario of draft 0.5 from the command line (an event of 64 KiB)
        run: |
          python tools/hostile_server.py oversized-event --port 8098 > "$RUNNER_TEMP/event.json" 2> /dev/null &
          pid=$!
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:8098/.well-known/lantern >/dev/null && break
            sleep 0.2
          done
          size=$(curl -fsS http://127.0.0.1:8098/api/lantern/v1/events | wc -c)
          kill "$pid"
          test "$size" -gt 65536

  conformance:
    name: the conformance suite against the demo servers
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"  # zstd in the standard library: JSON compressed as § 2.1 recommends
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: pytest -m conformance (Flask and FastAPI, anonymously and with a token bound to its key; a peer; --static)
        run: python -m pytest -m conformance -v
      - name: The suite's own report, against each framework, and the levels reached
        run: |
          set -o pipefail
          for framework in flask fastapi; do
            port=$([ "$framework" = flask ] && echo 8080 || echo 8081)
            python tests/demo.py --framework "$framework" --port "$port" --key-file "$RUNNER_TEMP/demo.key" &
            pid=$!
            for _ in $(seq 50); do
              curl -fsS "http://127.0.0.1:$port/.well-known/lantern" >/dev/null && break
              sleep 0.2
            done
            echo "::group::$framework"
            python ../spec/conformance/run.py "http://127.0.0.1:$port/" --admin-writes \
              --token et_demo-0123456789abcdef0123456789abcdef --key "$RUNNER_TEMP/demo.key" | tee "$RUNNER_TEMP/$framework.txt"
            echo "::endgroup::"
            grep -A8 '^Levels reached' "$RUNNER_TEMP/$framework.txt" >> "$GITHUB_STEP_SUMMARY"
            kill "$pid"
          done
      - name: The generator's static library, through the suite's --static
        run: |
          set -o pipefail
          python tests/demo.py --static "$RUNNER_TEMP/static"
          python ../spec/conformance/run.py --static "$RUNNER_TEMP/static" | tee "$RUNNER_TEMP/static.txt"
          grep -A1 '^Levels reached' "$RUNNER_TEMP/static.txt" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: sdist and wheel
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The wheel installs and imports, without any extra
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" -c "import lantern, lantern.client, lantern.server, lantern.static, lantern.peer, lantern.e2e; print(lantern.__version__)"
          "$RUNNER_TEMP/wheel/bin/lantern-static" --help > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error
