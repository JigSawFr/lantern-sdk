# The C API (c/, c/README.md): its generated accessors and ABI dump, its
# format, its build with warnings as errors on GCC 16 and clang 23 (with the
# C++ library built without exceptions too), MSVC and Xcode, its tests (unit,
# against the specification's reference server, the header as C11, C17 and
# C++, the ABI and the shared library's exports), the sanitizers,
# clang-tidy, the install, and its bindings' sketches: the Swift package on
# macOS, the JNI glue with the NDK.
name: c

# Called by ci.yml when the C API's files change: its folder, the C++
# library under it, the specification it follows (the submodule), this
# workflow, and the files every library of the repository shares
# (.github/scripts/changes.sh)
on:
  workflow_call:

permissions:
  contents: read

env:
  # As cpp.yml: LLVM's newest stable release (.github/actions/llvm); GCC's
  # newest is the gcc job's image
  CLANG: 23

jobs:
  generated:
    name: generated accessors and ABI
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The accessors are those cpp/'s model of the pinned schemas gives, and
      # the ABI is the one kept in c/abi/lantern.abi (c/README.md)
      - name: gen_c.py --check, abi_dump.py --check
        run: |
          python3 c/tools/gen_c.py --check
          python3 c/tools/abi_dump.py --check

  format:
    name: format
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CLANG_FORMAT_VERSION: 18.1.8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install -q "clang-format==$CLANG_FORMAT_VERSION"
          # c/.clang-format; the generated accessors as they are
          git ls-files 'c/*.c' 'c/*.h' 'c/*.cpp' 'c/*.hpp' ':!:c/src/generated/**' \
              ':!:c/include/lantern/lantern_documents.h' \
            | xargs "$RUNNER_TEMP/clang-format/bin/clang-format" --dry-run --Werror

  # GCC 16, the newest release, from GCC's official image (as cpp.yml): the
  # hardened dev build, the C++ inside without exceptions, ASan and UBSan.
  # SYS_PTRACE for LeakSanitizer.
  gcc:
    name: linux (gcc 16, ${{ matrix.preset }})
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    container:
      image: gcc:16.2.0@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb
      options: --cap-add=SYS_PTRACE
    strategy:
      fail-fast: false
      matrix:
        preset: [ dev, noexcept, asan, ubsan ]
    env:
      # The image's GCC, in /usr/local (cc and c++ are Debian's)
      CC: gcc
      CXX: g++
    steps:
      # Before the checkout, for the submodule: git is the image's. libcurl
      # and mbedTLS for the library's transports, a JDK for the JNI glue,
      # binutils for the exports' test
      - name: The adapters' libraries
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ccache \
            libcurl4-openssl-dev libmbedtls-dev openssl python3 default-jdk-headless binutils
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/cmake
        with:
          ccache: c-gcc16-${{ matrix.preset }}
      - name: Build
        working-directory: c
        run: |
          gcc --version | head -n 1
          cmake --preset "$PRESET" -DLANTERN_WERROR=ON
          cmake --build --preset "$PRESET"
          ccache --show-stats
        env:
          PRESET: ${{ matrix.preset }}
      # Unit tests (shared and static), the ABI and the exports, the
      # README's example, then the integration tests against spec/server,
      # side by side
      - name: Test
        working-directory: c
        run: ctest --preset "$PRESET" --parallel "$(nproc)"
        env:
          PRESET: ${{ matrix.preset }}

  # clang, LLVM's newest: the hardened dev build, and under ASan
  clang:
    name: linux (clang, ${{ matrix.preset }})
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [ dev, asan ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/llvm
        with:
          version: ${{ env.CLANG }}
      # As the gcc job's
      - name: Install the compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ccache "clang-$CLANG" "libclang-rt-$CLANG-dev" \
            libcurl4-openssl-dev libmbedtls-dev openssl default-jdk-headless binutils
      - uses: ./.github/actions/cmake
        with:
          ccache: c-clang-${{ matrix.preset }}
      - name: Build
        working-directory: c
        run: |
          export CC="clang-$CLANG" CXX="clang++-$CLANG"
          cmake --preset "$PRESET" -DLANTERN_WERROR=ON
          cmake --build --preset "$PRESET"
          ccache --show-stats
        env:
          PRESET: ${{ matrix.preset }}
      - name: Test
        working-directory: c
        run: ctest --preset "$PRESET" --parallel "$(nproc)"
        env:
          PRESET: ${{ matrix.preset }}

  tidy:
    name: clang-tidy (${{ matrix.stdlib }})
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        stdlib: [ libc++, libstdc++ ]
    env:
      # Ubuntu's LLVM 22, whose checks the code is clean of: clang-tidy 23
      # brings new ones (readability-trailing-comma, pointees in
      # misc-const-correctness…) that the code is to meet first
      TIDY: 22
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install clang and clang-tidy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "clang-$TIDY" "clang-tidy-$TIDY" \
            "libc++-$TIDY-dev" "libc++abi-$TIDY-dev" libcurl4-openssl-dev libmbedtls-dev
      - uses: ./.github/actions/cmake
      # c/src against libc++ and against libstdc++ (one job each), with
      # c/.clang-tidy (cpp/'s checks; it says why one more is off); the
      # generated accessors left out
      - name: clang-tidy
        run: |
          export CC="clang-$TIDY" CXX="clang++-$TIDY"
          if [ "$STDLIB" = libc++ ]; then
            cmake -S c --preset dev -B build/tidy -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
              -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libc++
          else
            cmake -S c --preset dev -B build/tidy
          fi
          "run-clang-tidy-$TIDY" -clang-tidy-binary "clang-tidy-$TIDY" -config-file c/.clang-tidy -p build/tidy -quiet \
            'c/src/[^g].*\.cpp$'
        env:
          STDLIB: ${{ matrix.stdlib }}

  install:
    name: linux (install, ${{ matrix.consumer }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        consumer: [ package, subdirectory ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cmake
        with:
          ccache: c-install-${{ matrix.consumer }}
      # An app's two ways in (c/README.md): find_package(LanternC) after an
      # install, or add_subdirectory of the source; the shared library and
      # the static one, from C
      - name: Build an app with the C API
        env:
          CONSUMER: ${{ matrix.consumer }}
        run: |
          if [ "$CONSUMER" = package ]; then
            cmake -S c -B build/lantern -G Ninja -DCMAKE_BUILD_TYPE=Release -DLANTERN_C_BUILD_TESTS=OFF \
              -DLANTERN_C_BUILD_EXAMPLES=OFF
            cmake --build build/lantern
            cmake --install build/lantern --prefix "$RUNNER_TEMP/prefix"
          fi
          cmake -S c/tests/consumer -B build/consumer -G Ninja -DLANTERN_CONSUMER="$CONSUMER" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build build/consumer
          build/consumer/lantern_c_consumer
          build/consumer/lantern_c_consumer_static

  windows:
    name: windows (${{ matrix.compiler }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: msvc, toolset: "" }
          - { compiler: clang-cl, toolset: "-T ClangCL" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # Visual Studio's generator (Visual Studio 2026); the DLL (dllexport) and the static
      # library, unit tests and the ABI dump (the integration tests' adapter
      # is POSIX); no TLS adapter, as in cpp.yml. MSBuild compiles side by
      # side, as in cpp.yml
      - name: Build
        shell: bash
        run: |
          # shellcheck disable=SC2086 # empty, or -T ClangCL
          cmake -S c -B build $TOOLSET -DLANTERN_WERROR=ON -DLANTERN_C_BUILD_TESTS=ON \
            -DLANTERN_CURL=OFF -DLANTERN_MBEDTLS=OFF "-DCMAKE_VS_GLOBALS=UseMultiToolTask=true;EnforceProcessCountAcrossBuilds=true"
          cmake --build build --config Debug --parallel
        env:
          TOOLSET: ${{ matrix.toolset }}
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure -R "c_unit|c_abi|c_readme"

  macos:
    # macOS 27 and Xcode 27, a preview image, as cpp.yml's
    runs-on: xcode-27
    # Not required, as in cpp.yml and Aurore: GitHub's macOS runners
    # sometimes leave the job without a machine. A failure is still shown,
    # and looked at.
    continue-on-error: true
    timeout-minutes: 30
    name: macos (Xcode clang, Swift)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/cmake
        with:
          ccache: c-macos
      # Xcode's clang (AppleClang), with Ninja
      - name: Build
        run: |
          cmake -S c -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLANTERN_WERROR=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -R "c_unit|c_abi|c_readme"
      # The Swift package of c/bindings/swift, over the library installed
      - name: Swift
        run: |
          cmake -S c -B build/swift -G Ninja -DCMAKE_BUILD_TYPE=Release -DLANTERN_C_BUILD_TESTS=OFF -DLANTERN_C_BUILD_EXAMPLES=OFF \
            -DLANTERN_CURL=OFF -DLANTERN_MBEDTLS=OFF
          cmake --build build/swift
          ccache --show-stats
          cmake --install build/swift --prefix "$RUNNER_TEMP/prefix"
          swift test --package-path c/bindings/swift -Xcc -I"$RUNNER_TEMP/prefix/include" \
            -Xlinker -L"$RUNNER_TEMP/prefix/lib" -Xlinker -rpath -Xlinker "$RUNNER_TEMP/prefix/lib"

  android:
    name: android (NDK, JNI, ${{ matrix.abi }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, x86_64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's newest NDK: liblantern_c.so and the JNI glue of
      # c/bindings/kotlin (the Kotlin side is an app's Gradle build)
      - uses: ./.github/actions/cmake
        with:
          ccache: c-android-${{ matrix.abi }}
      - name: Build
        env:
          ABI: ${{ matrix.abi }}
        run: |
          cmake -S c/bindings/kotlin/src/main/c -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DLANTERN_WERROR=ON
          cmake --build build
          test -f build/liblantern_jni.so
