# A release of the SDK (RELEASING.md): started by the GitHub release
# release-please creates (release-please.yml), or by hand for a tag. Each
# language's files are built from the tag, reproducibly
# (tools/release_build.sh), with their SBOMs; then every file is attested
# (SLSA build provenance, and the SBOMs linked to what they describe),
# listed in SHA256SUMS and attached to the release, whose notes are laid out
# by language; then the Python package goes to PyPI and the TypeScript one to
# npm, each by trusted publishing (OIDC: no token kept). Nothing here runs
# before a release exists.
name: release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (vX.Y.Z), the one chosen above in 'Use workflow from': its files built, attested and attached again"
        required: true
        type: string
      publish:
        description: "Publish to PyPI and npm too (a version already there is refused by them)"
        type: boolean
        default: false

permissions:
  contents: read

# One run a release at a time; never one cancelled halfway through publishing
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  # The tag is a version of this SDK, and every language states it
  meta:
    name: the version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: The tag and the versions
        id: version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vX.Y.Z)"; exit 1; }
          # By hand, from the tag itself (Use workflow from: Tags), so that the
          # attestations name the tag as their source, as the release's do
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::run this workflow from the tag $TAG, not from $GITHUB_REF"
            exit 1
          fi
          python3 tools/release_versions.py --expect "${TAG#v}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  python:
    name: python (sdist, wheel, SBOM)
    needs: meta
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # build, hatchling and cyclonedx-bom, and everything they need, by hash
      - name: The release's tools
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet --require-hashes -r tools/release-requirements.txt
      - name: Build
        env:
          PYTHON: ${{ runner.temp }}/tools/bin/python
        run: tools/release_build.sh -o dist python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: dist/
          if-no-files-found: error

  npm:
    name: typescript (npm tarball, SBOM)
    needs: meta
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build
        run: tools/release_build.sh -o dist npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm
          path: dist/
          if-no-files-found: error

  # The source archive, and the C++ library and the C API built for Linux
  # x86_64 with GCC 15 (no TLS adapter: the app's libcurl or mbedTLS)
  native:
    name: c++ and c (source, linux x86_64, SBOMs)
    needs: meta
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      GCC: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install the compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build "g++-$GCC"
      - name: Build
        env:
          LANTERN_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          export CC=gcc-$GCC CXX=g++-$GCC
          tools/release_build.sh -o dist source cpp c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native
          path: dist/
          if-no-files-found: error

  # Every file attested, listed and attached; the notes laid out by language
  attest:
    name: attest and attach
    needs: [ meta, python, npm, native ]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write      # the release's assets and notes
      id-token: write      # the attestations' Sigstore certificate
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      # Who built each file, from which commit, with which workflow:
      #   gh attestation verify FILE -R JigSawFr/lantern-sdk
      # GitHub's attestations, signed through Sigstore (no cosign key: the
      # house signs nothing else with cosign, and SHA256SUMS is attested too).
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Each package's SBOM, linked to the files it describes:
      #   gh attestation verify FILE -R JigSawFr/lantern-sdk --predicate-type https://cyclonedx.org/bom
      - name: SBOM of the Python package
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/lantern_protocol-${{ env.VERSION }}-py3-none-any.whl
            dist/lantern_protocol-${{ env.VERSION }}.tar.gz
          sbom-path: dist/lantern-protocol-${{ env.VERSION }}.pypi.cdx.json
      - name: SBOM of the npm package
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/lantern-protocol-${{ env.VERSION }}.tgz
          sbom-path: dist/lantern-protocol-${{ env.VERSION }}.npm.cdx.json
      - name: SBOM of the C++ library
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/lantern-cpp-${{ env.VERSION }}-linux-x86_64.tar.gz
          sbom-path: dist/lantern-cpp-${{ env.VERSION }}.cdx.json
      - name: SBOM of the C API
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/lantern-c-${{ env.VERSION }}-linux-x86_64.tar.gz
          sbom-path: dist/lantern-c-${{ env.VERSION }}.cdx.json
      # The release exists (release-please made it with the tag): the files
      # are added to it, a run again replacing its own; then its notes, by
      # language, from CHANGELOG.md and .github/release-notes/X.Y.Z.md
      - name: Attach to the release, and its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" --clobber dist/*
          python3 tools/release_notes.py "$VERSION" --sums dist/SHA256SUMS > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "## Lantern SDK $VERSION"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # PyPI, by trusted publishing: PyPI trusts this workflow, in the pypi
  # environment, of this repository (RELEASING.md); the action also uploads
  # PEP 740 attestations of each file, signed with the same identity.
  pypi:
    name: publish to PyPI
    needs: [ meta, attest ]
    if: github.repository == 'JigSawFr/lantern-sdk' && (github.event_name == 'release' || inputs.publish)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lantern-protocol/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write      # trusted publishing, and the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python
          path: dist
      # The sdist and the wheel alone: the action uploads all it finds
      - name: The packages
        run: |
          mkdir packages
          mv dist/*.whl dist/lantern_protocol-*.tar.gz packages/
          ls -l packages
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/
          attestations: true
          print-hash: true

  # npm, by trusted publishing (OIDC) and with provenance. npm cannot trust
  # a package that does not exist yet: the very first version is published
  # with a granular token kept in the npm environment as NPM_TOKEN, deleted
  # once trusted publishing is set up (RELEASING.md).
  npm-publish:
    name: publish to npm
    needs: [ meta, attest ]
    if: github.repository == 'JigSawFr/lantern-sdk' && (github.event_name == 'release' || inputs.publish)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/lantern-protocol/v/${{ needs.meta.outputs.version }}
    permissions:
      id-token: write      # trusted publishing, and the provenance
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Trusted publishing needs npm 11.5.1 or later
      - name: npm 11
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-npm
          path: dist
      # The tarball attested above, as it is; its package.json says public
      # and with provenance (publishConfig)
      - name: npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice::published with NPM_TOKEN: delete it once trusted publishing is set up (RELEASING.md)"
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          npm publish "dist/lantern-protocol-$VERSION.tgz" --provenance --access public
