# The workflows themselves (.github/): actionlint, which reads each one and
# each composite action's use (expressions, reusable workflows' inputs and
# jobs, runner labels with .github/actionlint.yaml), and checks their shell
# scripts with shellcheck (the runner's); then the scripts of
# .github/scripts with shellcheck and Python's compiler.
name: workflows

# Called by ci.yml when anything under .github/ changes
on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      # actionlint_1.7.12_checksums.txt's line for linux_amd64
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          shellcheck --version | head -n 2
          "$RUNNER_TEMP/actionlint" -color
      - name: The scripts
        run: |
          shellcheck .github/scripts/*.sh
          python3 -m py_compile .github/scripts/*.py
