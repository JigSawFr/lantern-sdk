# ccache for the job's CMake builds, through CMake's own environment
# variables (CMAKE_C_COMPILER_LAUNCHER, CMAKE_CXX_COMPILER_LAUNCHER): every
# configure of the job takes it, presets or not, and nothing in the project
# names it. Its folder goes to the Actions cache under the given key and the
# commit, and comes back from the latest one of this branch, then of main:
# a new push to a pull request, or a run again, compiles only what changed.
# Each job keeps it under 300 MB (compressed), the oldest objects out first.
name: ccache
description: Compiler cache for the job's CMake builds
inputs:
  key:
    description: The job's cache, one per compiler and configuration (e.g. cpp-linux-gcc)
    required: true
runs:
  using: composite
  steps:
    - name: ccache's settings
      shell: bash
      run: |
        {
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_COMPRESS=1"
          echo "CCACHE_MAXSIZE=300M"
          # The compiler's own bytes, not its date: the runner's packages and
          # the containers' images are installed anew in each job
          echo "CCACHE_COMPILERCHECK=content"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
    - name: ccache
      id: ccache
      shell: bash
      env:
        KEY: ${{ inputs.key }}
      run: |
        # A cache key has no comma: anything but letters, digits and . _ + -
        # becomes a dash
        echo "key=$(printf '%s' "$KEY" | tr -c 'A-Za-z0-9._+-' '-')" >> "$GITHUB_OUTPUT"
        if ! command -v ccache > /dev/null; then
          if [ "$RUNNER_OS" = macOS ]; then
            brew install --quiet ccache
          else
            sudo=$(command -v sudo || true)
            $sudo apt-get update -q
            $sudo apt-get install -y -q --no-install-recommends ccache
          fi
        fi
        ccache --zero-stats > /dev/null
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ccache
        key: ccache-${{ steps.ccache.outputs.key }}-${{ github.sha }}
        restore-keys: ccache-${{ steps.ccache.outputs.key }}-
