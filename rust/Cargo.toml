[package]
name = "lantern-protocol"
description = "Client and server library for the Lantern protocol, between console homebrews and home game library servers."
version = "0.5.0" # x-release-please-version
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/JigSawFr/lantern-sdk"
homepage = "https://lantern.boreale.dev/"
readme = "README.md"
keywords = ["lantern", "homebrew", "game-library", "protocol"]
categories = ["network-programming", "api-bindings"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
regex = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
url = "2"
getrandom = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[features]
# The operating system's random bytes for the client (off by default: the library draws none itself)
os-entropy = ["dep:getrandom"]
# An HTTP transport over reqwest and rustls, with the server's key pinned (SPEC.md § 5.3)
http = ["dep:reqwest", "dep:rustls", "dep:webpki-roots"]
webpki-roots = ["dep:webpki-roots"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
